<meta charset="utf-8">
<style>
:root{--accent:#d6248f;--dark:#181720;--ink:#181720;--line:#e7e4ee;--body:#4a4653;--paper:#faf8fc;--bg:#fff}
body{font-family:system-ui;margin:0;background:#faf8f5}
.pgbld{max-width:1100px;margin:0 auto;background:#fff}
.pgbld .wrap{padding:0 30px}
.pgbld h2{font-size:26px;color:var(--ink)}
</style>
<div class="pgbld"><div class="wrap">
  <section class="s-hero"><h2>Revive Your Hair Naturally</h2><p>Some intro copy.</p></section>
</div></div>
<style>
  /* editor chrome — never shipped to a published page */
  [data-ed-hover]{outline:2px solid var(--accent,#d6248f)!important;outline-offset:2px;border-radius:4px;cursor:text}
  [data-ed-img]{cursor:pointer}
  [data-ed-hover][data-ed-img]{outline-style:dashed!important;cursor:pointer}
  [contenteditable=true]{outline:2px solid var(--accent,#d6248f)!important;outline-offset:2px;cursor:text}
  [contenteditable=true]:focus{outline:2px solid var(--accent,#d6248f)!important}
  .ed-secwrap{position:relative}
  .ed-secwrap[data-ed-sechover]{box-shadow:inset 0 0 0 2px rgba(37,99,235,.5);border-radius:6px}
  .ed-secwrap.ed-drag-src{opacity:.4}
  /* a clean light toolbar (Notion/Webflow-style) — appears top-right on section hover */
  .ed-rail{position:absolute;top:10px;right:10px;z-index:9999;display:none;align-items:center;gap:1px;background:#fff;border:1px solid rgba(20,18,15,.1);border-radius:11px;padding:3px;box-shadow:0 8px 24px -8px rgba(20,18,15,.35)}
  .ed-secwrap[data-ed-sechover] > .ed-rail{display:flex}
  .ed-rail button{all:unset;color:#4a4653;min-width:30px;height:30px;display:grid;place-items:center;border-radius:8px;font-size:15px;cursor:pointer;line-height:1}
  .ed-rail button:hover{background:#f0edf6;color:#181720}
  .ed-rail .grip{cursor:grab;color:#9891a6;font-size:16px;letter-spacing:-2px}
  .ed-rail .grip:active{cursor:grabbing}
  .ed-rail .sep{width:1px;height:18px;background:rgba(20,18,15,.1);margin:0 2px}
  .ed-rail .del:hover{background:#fdecec;color:#c0392b}
  /* the insertion line shown while dragging a section */
  .ed-drop{position:fixed;height:3px;background:var(--accent,#d6248f);border-radius:3px;z-index:100000;pointer-events:none;box-shadow:0 0 0 3px rgba(214,36,143,.18)}
  body.ed-dragging, body.ed-dragging *{cursor:grabbing !important;user-select:none !important}
  /* ＋ add-a-section button that appears between sections */
  .ed-add{position:relative;height:0;z-index:9998}
  .ed-add > button{position:absolute;left:50%;top:-15px;transform:translateX(-50%);background:var(--accent,#d6248f);color:#fff;border:none;border-radius:100px;height:30px;padding:0 16px;font-size:13px;font-weight:700;cursor:pointer;opacity:0;transition:opacity .12s;box-shadow:0 4px 14px -4px rgba(0,0,0,.4);white-space:nowrap}
  .ed-add:hover > button{opacity:1}
  .ed-toolbar{position:fixed;z-index:10000;display:none;align-items:center;gap:2px;background:#111;border-radius:9px;padding:4px;box-shadow:0 8px 24px -6px rgba(0,0,0,.5)}
  .ed-toolbar button{all:unset;color:#fff;min-width:28px;height:28px;display:grid;place-items:center;border-radius:6px;font-size:14px;font-weight:800;cursor:pointer;padding:0 6px}
  .ed-toolbar button:hover{background:rgba(255,255,255,.16)}
  .ed-toolbar .ed-tsep{width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 3px}
  .ed-toolbar .ed-linkbox{display:none;align-items:center;gap:4px;margin-left:3px;padding-left:5px;border-left:1px solid rgba(255,255,255,.2)}
  .ed-toolbar .ed-linkbox input{all:unset;background:#fff;color:#181720;border-radius:6px;padding:5px 9px;font-size:13px;width:170px;height:auto}
  .ed-toolbar .ed-linkbox button{background:var(--accent,#d6248f);min-width:auto;padding:0 12px;height:26px}
  .ed-toolbar .ed-linkbox button:hover{filter:brightness(1.1);background:var(--accent,#d6248f)}
  .ed-toolbar .ed-iconbox{display:none;position:absolute;top:34px;left:0;flex-wrap:wrap;gap:2px;width:236px;max-height:180px;overflow:auto;background:#111;border-radius:9px;padding:6px;box-shadow:0 8px 24px -6px rgba(0,0,0,.55)}
  .ed-toolbar .ed-iconbox button{min-width:30px;height:30px;font-size:17px;font-weight:400}
  .ed-toolbar input[type=color]{width:24px;height:22px;border:none;border-radius:5px;padding:0;margin:0 1px;background:none;cursor:pointer;vertical-align:middle}
  .ed-img-badge{position:absolute;inset:0;display:none;place-items:center;pointer-events:none}
  .pgbld [data-ed-imgwrap]{position:relative}
  /* section style popover (background + spacing) */
  .ed-stylepop{position:fixed;z-index:10001;background:#fff;border:1px solid rgba(20,18,15,.12);border-radius:12px;padding:10px 11px;box-shadow:0 14px 34px -8px rgba(20,18,15,.42);width:236px;font:13px/1.3 system-ui,-apple-system,sans-serif;color:#181720}
  .ed-stylepop .sp-h{font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#9891a6;margin:0 2px 6px}
  .ed-stylepop .sp-row{display:flex;align-items:center;gap:8px;padding:5px 2px}
  .ed-stylepop .sp-row span{flex:1;color:#4a4653;font-weight:600}
  .ed-stylepop input[type=color]{width:30px;height:26px;border:1px solid rgba(0,0,0,.12);border-radius:6px;padding:0;background:none;cursor:pointer}
  .ed-stylepop button{all:unset;min-width:26px;height:26px;display:inline-grid;place-items:center;border:1px solid rgba(0,0,0,.12);border-radius:6px;cursor:pointer;color:#333;font-weight:700}
  .ed-stylepop button:hover{background:#f0edf6}
  .ed-stylepop b{min-width:32px;text-align:center;font-variant-numeric:tabular-nums}
</style>
<script>
(function(){
  var EDITABLE_TEXT = 'H1,H2,H3,H4,H5,H6,P,LI,A,SPAN,SUMMARY,BUTTON,STRONG,EM,DIV,BLOCKQUOTE,FIGCAPTION';
  var dirty=false, uid=0;
  function post(m){ try{ parent.postMessage(Object.assign({__pgbld:1}, m),'*'); }catch(e){} }
  function markDirty(){ if(!dirty){dirty=true;} post({t:'dirty'}); }
  function eid(el){ if(!el.dataset.eid){ el.dataset.eid='e'+(++uid); } return el.dataset.eid; }
  function rgbToHex(c){ var m=/rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(c||''); if(!m) return '#000000'; return '#'+[1,2,3].map(function(i){ return ('0'+parseInt(m[i],10).toString(16)).slice(-2); }).join(''); }

  // ── which elements are directly text-editable: a leaf that carries visible text and whose only
  // children (if any) are inline formatting. Skip elements that contain block children (they're layout). ──
  function isTextLeaf(el){
    if(!el || el.nodeType!==1) return false;
    if(!EDITABLE_TEXT.split(',').includes(el.tagName)) return false;
    if(el.closest('.ed-rail,.ed-toolbar,.ed-add')) return false;
    if(el.querySelector('img,svg,input,textarea,select,details')) return false;
    // has block-level element children? then it's a container, not a text leaf
    for(var i=0;i<el.children.length;i++){ var c=el.children[i]; var d=getComputedStyle(c).display; if(d!=='inline'&&d!=='inline-block'&&c.tagName!=='STRONG'&&c.tagName!=='EM'&&c.tagName!=='BR'&&c.tagName!=='SPAN'&&c.tagName!=='A') return false; }
    return (el.textContent||'').trim().length>0;
  }
  function isImg(el){ return el && el.nodeType===1 && el.tagName==='IMG'; }

  // ── hover highlight ──
  var hovered=null;
  document.addEventListener('mouseover', function(e){
    if(editing) return;
    var t=e.target;
    var img=t.closest('img');
    var leaf=img?null:closestLeaf(t);
    var el=img||leaf;
    if(el!==hovered){ clearHover(); hovered=el; if(el){ el.setAttribute('data-ed-hover',''); if(img) el.setAttribute('data-ed-img',''); } }
  }, true);
  function clearHover(){ if(hovered){ hovered.removeAttribute('data-ed-hover'); hovered.removeAttribute('data-ed-img'); hovered=null; } }
  function closestLeaf(t){ var el=t; for(var i=0;i<6&&el;i++){ if(isTextLeaf(el)) return el; el=el.parentElement; } return null; }

  // ── click: image → parent popover;  text → inline edit ──
  var editing=null;
  document.addEventListener('click', function(e){
    var img=e.target.closest('img');
    if(img){ e.preventDefault(); e.stopPropagation(); selectImage(img); return; }
    var leaf=closestLeaf(e.target);
    if(leaf){ if(leaf.tagName==='A'||leaf.closest('a')) e.preventDefault(); startEdit(leaf, e); }
  }, true);

  function selectImage(img){ clearHover(); post({t:'image', id:eid(img), src:img.currentSrc||img.src}); }

  function startEdit(el, e){
    if(editing===el) return;
    stopEdit();
    editing=el; clearHover();
    el.setAttribute('contenteditable','true');
    el.focus();
    // place caret where clicked
    try{ var r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null; if(r){ var s=getSelection(); s.removeAllRanges(); s.addRange(r);} }catch(_){}
    showToolbar(el);
    el.addEventListener('input', markDirty);
    el.addEventListener('keydown', onKey);
    el.addEventListener('blur', onBlur);
  }
  // Don't stop editing when focus moves INTO the toolbar (e.g. the link URL input) — only on a real blur.
  function onBlur(ev){ if(ev.relatedTarget && tb && tb.contains(ev.relatedTarget)) return; stopEdit(); }
  function onKey(ev){
    if(ev.key==='Escape'){ ev.preventDefault(); stopEdit(); }
    // single-line fields (headings, labels, buttons) commit on Enter
    if(ev.key==='Enter' && ['H1','H2','H3','H4','H5','H6','A','BUTTON','SUMMARY','SPAN','LI'].includes(editing.tagName) && !ev.shiftKey){ ev.preventDefault(); stopEdit(); }
  }
  function stopEdit(){
    if(!editing) return;
    var el=editing; editing=null;
    el.removeEventListener('input', markDirty);
    el.removeEventListener('keydown', onKey);
    el.removeEventListener('blur', onBlur);
    el.removeAttribute('contenteditable');
    hideToolbar();
  }

  // ── floating rich-text toolbar: Bold (accent), Italic, Link, Unlink (Shopify-style) ──
  var tb, tbInput, savedRange;
  function saveRange(){ var s=getSelection(); if(s && s.rangeCount) savedRange=s.getRangeAt(0).cloneRange(); }
  function restoreRange(){ if(savedRange){ var s=getSelection(); s.removeAllRanges(); s.addRange(savedRange); } }
  function currentHref(){ var n=getSelection().anchorNode; for(var i=0;i<6&&n;i++){ if(n.nodeType===1 && n.tagName==='A') return n.getAttribute('href')||''; n=n.parentNode; } return ''; }
  function toolbar(){
    if(tb) return tb;
    tb=document.createElement('div'); tb.className='ed-toolbar';
    var ICONS='✓ ✔ ★ ☆ ✦ ✧ ❤ ♥ ⚡ ✨ 🌿 🌱 💧 🔥 🛡️ ♻️ ⏱️ 🚚 🎁 💬 👍 🏆 🔒 ✅ 🌎 ⭐ 💯 ✂️ 🧴 💆 💊 🌸 🍯 🥇 📦 ➜ → ✱'.split(' ');
    tb.innerHTML='<button data-cmd="bold" title="Bold / accent">B</button>'
      +'<button data-cmd="italic" title="Italic" style="font-style:italic;font-weight:600">i</button>'
      +'<input type="color" data-cmd="fg" title="Text colour">'
      +'<button data-cmd="smaller" title="Smaller">A−</button>'
      +'<button data-cmd="bigger" title="Bigger">A+</button>'
      +'<button data-cmd="alignleft" title="Align left">⇤</button>'
      +'<button data-cmd="aligncenter" title="Center">≡</button>'
      +'<button data-cmd="alignright" title="Align right">⇥</button>'
      +'<span class="ed-tsep"></span>'
      +'<button data-cmd="icon" title="Insert an icon">☆</button>'
      +'<button data-cmd="img" title="Insert an image / logo">🖼</button>'
      +'<button data-cmd="link" title="Add link">🔗</button>'
      +'<button data-cmd="unlink" title="Remove link">✗</button>'
      +'<span class="ed-linkbox"><input type="url" placeholder="https://… or /pages/…"><button data-cmd="applylink">Add</button></span>'
      +'<span class="ed-iconbox">'+ICONS.map(function(ch){ return '<button data-cmd="ins" data-ch="'+ch+'">'+ch+'</button>'; }).join('')+'</span>';
    tb.addEventListener('mousedown', function(ev){
      var btn=ev.target.closest && ev.target.closest('button'); if(!btn) return;
      var c=btn.getAttribute('data-cmd');
      if(c==='applylink'){ ev.preventDefault(); applyLink(); return; }
      if(c==='link'){ ev.preventDefault(); openLinkBox(); return; }
      if(c==='icon'){ ev.preventDefault(); toggleIconBox(); return; }
      if(c==='img'){ ev.preventDefault(); insertImageAtEditing(); return; }
      if(c==='ins'){ ev.preventDefault(); restoreRange(); document.execCommand('insertText',false,btn.getAttribute('data-ch')); markDirty(); closeIconBox(); return; }
      if(c==='smaller'||c==='bigger'){ ev.preventDefault(); bumpSize(c==='bigger'?1:-1); return; }
      if(c==='alignleft'||c==='aligncenter'||c==='alignright'){ ev.preventDefault(); setAlign(c.slice(5)); return; }
      ev.preventDefault();
      if(c==='bold'||c==='italic'||c==='unlink'){ document.execCommand(c==='unlink'?'unlink':c,false,null); markDirty(); }
    });
    // text colour (native picker; the editable keeps focus because the input lives inside the toolbar)
    tb.addEventListener('input', function(ev){ if(ev.target&&ev.target.getAttribute('data-cmd')==='fg'&&editing){ editing.style.color=ev.target.value; markDirty(); } });
    tbInput=tb.querySelector('.ed-linkbox input');
    tbInput.addEventListener('keydown', function(ev){ ev.stopPropagation(); if(ev.key==='Enter'){ ev.preventDefault(); applyLink(); } else if(ev.key==='Escape'){ ev.preventDefault(); closeLinkBox(); } });
    document.body.appendChild(tb); return tb;
  }
  // Insert a brand-new image (logo/badge/photo) right after the text you're editing, then open the
  // Upload / Generate / Swap popover for it (reuses the same flow as any existing image). In a press-logo
  // row it drops in as a logo; elsewhere as a responsive block image.
  var IMG_PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="240" height="96"><rect width="100%" height="100%" rx="10" fill="#efe6ff"/><text x="50%" y="54%" text-anchor="middle" fill="#8b7fb0" font-family="sans-serif" font-size="13">Add image</text></svg>');
  function insertImageAtEditing(){
    if(!editing) return;
    var host=editing, img=document.createElement('img'); img.src=IMG_PH; img.alt='';
    if(host.classList.contains('plogo') || (host.closest&&host.closest('.logos'))){ img.className='plogo'; }
    else { img.className='ed-inserted'; img.style.maxWidth='100%'; img.style.height='auto'; img.style.display='block'; img.style.margin='12px 0'; img.style.borderRadius='10px'; }
    host.insertAdjacentElement('afterend', img);
    eid(img); markDirty(); stopEdit(); selectImage(img);
  }
  function bumpSize(dir){ if(!editing) return; var cur=parseFloat(getComputedStyle(editing).fontSize)||16; var nv=Math.max(9, Math.min(96, cur+dir*(cur>=28?3:2))); editing.style.fontSize=Math.round(nv)+'px'; markDirty(); }
  function setAlign(a){ if(!editing) return; editing.style.textAlign=a; markDirty(); }
  function toggleIconBox(){ var box=tb.querySelector('.ed-iconbox'); if(box.style.display==='flex'){ closeIconBox(); return; } saveRange(); box.style.display='flex'; }
  function closeIconBox(){ if(tb){ tb.querySelector('.ed-iconbox').style.display='none'; } }
  function openLinkBox(){ saveRange(); var box=tb.querySelector('.ed-linkbox'); box.style.display='inline-flex'; tbInput.value=currentHref(); setTimeout(function(){ tbInput.focus(); tbInput.select(); },0); }
  function closeLinkBox(){ if(tb){ tb.querySelector('.ed-linkbox').style.display='none'; tbInput.value=''; } if(editing) editing.focus(); }
  function applyLink(){
    var url=(tbInput.value||'').trim();
    restoreRange();
    if(url){ if(!/^(https?:|mailto:|tel:|#)/i.test(url) && url.charAt(0)!=='/') url='https://'+url; document.execCommand('createLink',false,url);
      // open in a new tab for external links
      try{ var a=getSelection().anchorNode; var el=a&&a.nodeType===1?a:a&&a.parentNode; var link=el&&el.closest?el.closest('a'):null; if(link&&/^https?:/i.test(url)){ link.setAttribute('target','_blank'); link.setAttribute('rel','noopener'); } }catch(_){}
      markDirty();
    }
    closeLinkBox();
  }
  function showToolbar(el){ var t=toolbar(); t.querySelector('.ed-linkbox').style.display='none'; t.querySelector('.ed-iconbox').style.display='none'; try{ t.querySelector('input[data-cmd="fg"]').value=rgbToHex(getComputedStyle(el).color); }catch(_){} var r=el.getBoundingClientRect(); t.style.display='flex'; t.style.left=Math.max(8,r.left)+'px'; t.style.top=Math.max(8,r.top-42)+'px'; }
  function hideToolbar(){ if(tb) tb.style.display='none'; }

  // ── sections: wrap every top-level section so we can hover a rail + insert ＋ between them ──
  function sectionHosts(){
    var hosts=[];
    var pg=document.querySelector('.pgbld'); if(!pg) return hosts;
    // direct children of .pgbld (full-bleed bands) and of .pgbld .wrap (contained sections)
    Array.prototype.forEach.call(pg.children, function(c){ if(c.classList.contains('wrap')){ Array.prototype.forEach.call(c.children, function(w){ hosts.push(w); }); } else if(!c.classList.contains('floatcta')) hosts.push(c); });
    return hosts;
  }
  function buildSections(){
    sectionHosts().forEach(function(sec){
      if(sec.classList.contains('ed-secwrap')||sec.classList.contains('ed-add')) return;
      sec.classList.add('ed-secwrap');
      eid(sec);
      var rail=document.createElement('div'); rail.className='ed-rail'; rail.contentEditable='false';
      rail.innerHTML='<button class="grip" title="Drag to move this section">⠿</button><span class="sep"></span>'
        +'<button data-a="up" title="Move up">↑</button><button data-a="down" title="Move down">↓</button>'
        +'<span class="sep"></span><button data-a="style" title="Background &amp; spacing">🎨</button>'
        +'<button data-a="dupe" title="Duplicate">⧉</button><button class="del" data-a="del" title="Delete">🗑</button>';
      rail.addEventListener('click', function(ev){ ev.stopPropagation(); ev.preventDefault(); var a=(ev.target.getAttribute&&ev.target.getAttribute('data-a')); if(a) sectionAction(sec,a); });
      // drag-to-reorder from the grip handle (Notion/Webflow-style)
      var grip=rail.querySelector('.grip');
      grip.addEventListener('pointerdown', function(ev){ ev.preventDefault(); ev.stopPropagation(); startDrag(sec, grip, ev); });
      sec.appendChild(rail);
      // a ＋ divider (Notion/Framer-style) in the gap ABOVE this section → asks the parent to add here
      if(!(sec.previousElementSibling&&sec.previousElementSibling.classList.contains('ed-add'))){
        var add=document.createElement('div'); add.className='ed-add'; add.contentEditable='false';
        add.innerHTML='<button title="Add a section here">＋ Add section here</button>';
        add.querySelector('button').addEventListener('click', function(ev){ ev.preventDefault(); ev.stopPropagation(); post({t:'addAt', anchorId:eid(sec)}); });
        sec.parentNode.insertBefore(add, sec);
      }
    });
  }
  document.addEventListener('mouseover', function(e){ if(dragEl) return; var s=e.target.closest('.ed-secwrap'); document.querySelectorAll('.ed-secwrap[data-ed-sechover]').forEach(function(x){ if(x!==s) x.removeAttribute('data-ed-sechover'); }); if(s) s.setAttribute('data-ed-sechover',''); }, true);

  function siblingSections(sec){ return Array.prototype.filter.call((sec.parentNode||document).children, function(c){ return c.classList.contains('ed-secwrap'); }); }
  function sectionAction(sec, a){
    if(a==='del'){ if(confirm('Delete this section?')){ sec.remove(); markDirty(); } }
    else if(a==='up'){ var p=sec.previousElementSibling; while(p&&!p.classList.contains('ed-secwrap')) p=p.previousElementSibling; if(p){ sec.parentNode.insertBefore(sec,p); markDirty(); sec.scrollIntoView({behavior:'smooth',block:'center'}); } }
    else if(a==='down'){ var n=sec.nextElementSibling; while(n&&!n.classList.contains('ed-secwrap')) n=n.nextElementSibling; if(n){ sec.parentNode.insertBefore(n,sec); markDirty(); sec.scrollIntoView({behavior:'smooth',block:'center'}); } }
    else if(a==='dupe'){ var clone=sec.cloneNode(true); clone.removeAttribute('data-eid'); eid(clone); sec.parentNode.insertBefore(clone, sec.nextSibling); markDirty(); }
    else if(a==='style'){ openSectionStyle(sec); }
  }

  // ── section style popover: background colour + vertical spacing (padding) ──
  var secPop=null;
  function closeSecPop(){ if(secPop){ secPop.remove(); secPop=null; } }
  function openSectionStyle(sec){
    closeSecPop();
    var cs=getComputedStyle(sec);
    var pop=document.createElement('div'); pop.className='ed-stylepop'; pop.contentEditable='false';
    pop.innerHTML=''
      +'<div class="sp-h">Section style</div>'
      +'<div class="sp-row"><span>Background</span><input type="color" data-s="bg" value="'+rgbToHex(cs.backgroundColor)+'"><button data-s="bgclear" title="Clear background">✗</button></div>'
      +'<div class="sp-row"><span>Text colour</span><input type="color" data-s="fg" value="'+rgbToHex(cs.color)+'"></div>'
      +'<div class="sp-row"><span>Space above/below</span><button data-s="padminus">−</button><b data-pad>'+Math.round(parseFloat(cs.paddingTop)||0)+'</b><button data-s="padplus">＋</button></div>';
    document.body.appendChild(pop);
    var r=sec.getBoundingClientRect();
    pop.style.left=Math.max(8, Math.min(window.innerWidth-246, r.right-238))+'px';
    pop.style.top=Math.max(8, Math.min(window.innerHeight-160, r.top+46))+'px';
    pop.addEventListener('input', function(ev){ var s=ev.target.getAttribute('data-s'); if(s==='bg'){ sec.style.background=ev.target.value; markDirty(); } else if(s==='fg'){ sec.style.color=ev.target.value; markDirty(); } });
    pop.addEventListener('click', function(ev){ var b=ev.target.closest&&ev.target.closest('button'); if(!b) return; var s=b.getAttribute('data-s');
      if(s==='bgclear'){ sec.style.background=''; markDirty(); }
      else if(s==='padminus'||s==='padplus'){ var cur=parseFloat(getComputedStyle(sec).paddingTop)||0; var nv=Math.max(0, cur+(s==='padplus'?8:-8)); sec.style.paddingTop=nv+'px'; sec.style.paddingBottom=nv+'px'; pop.querySelector('[data-pad]').textContent=Math.round(nv); markDirty(); }
    });
  }
  document.addEventListener('mousedown', function(e){ if(secPop && !secPop.contains(e.target) && !(e.target.closest&&e.target.closest('.ed-rail'))) closeSecPop(); }, true);

  // ── drag-to-reorder ──
  var dragEl=null, dropLine=null, dropTarget=null, dropPos='before';
  function startDrag(sec, grip, ev){
    dragEl=sec; dropTarget=null;
    sec.classList.add('ed-drag-src');
    document.body.classList.add('ed-dragging');
    document.querySelectorAll('.ed-secwrap[data-ed-sechover]').forEach(function(x){ x.removeAttribute('data-ed-sechover'); });
    try{ grip.setPointerCapture(ev.pointerId); }catch(_){}
    dropLine=document.createElement('div'); dropLine.className='ed-drop'; document.body.appendChild(dropLine);
    grip.addEventListener('pointermove', onDrag);
    grip.addEventListener('pointerup', endDrag, {once:true});
    grip.addEventListener('pointercancel', endDrag, {once:true});
  }
  function onDrag(ev){
    if(!dragEl) return;
    // only reorder within the same container (keeps full-bleed bands vs contained sections in their lane)
    var sibs=siblingSections(dragEl).filter(function(s){ return s!==dragEl; });
    var y=ev.clientY, chosen=null, pos='after';
    for(var i=0;i<sibs.length;i++){ var r=sibs[i].getBoundingClientRect(); if(y < r.top + r.height/2){ chosen=sibs[i]; pos='before'; break; } }
    if(!chosen && sibs.length){ chosen=sibs[sibs.length-1]; pos='after'; }
    dropTarget=chosen; dropPos=pos;
    if(chosen && dropLine){ var rr=chosen.getBoundingClientRect(); dropLine.style.left=rr.left+'px'; dropLine.style.width=rr.width+'px'; dropLine.style.top=((pos==='before'?rr.top:rr.bottom)-1.5)+'px'; dropLine.style.display='block'; }
    else if(dropLine){ dropLine.style.display='none'; }
    // auto-scroll near edges
    var vh=window.innerHeight; if(y<70) window.scrollBy(0,-14); else if(y>vh-70) window.scrollBy(0,14);
  }
  function endDrag(){
    if(dragEl){
      dragEl.classList.remove('ed-drag-src');
      if(dropTarget && dropTarget!==dragEl){ if(dropPos==='before') dropTarget.parentNode.insertBefore(dragEl,dropTarget); else dropTarget.parentNode.insertBefore(dragEl,dropTarget.nextSibling); markDirty(); dragEl.scrollIntoView({behavior:'smooth',block:'center'}); }
    }
    document.body.classList.remove('ed-dragging');
    if(dropLine){ dropLine.remove(); dropLine=null; }
    dragEl=null; dropTarget=null;
  }

  // ── receive commands from the parent ──
  window.addEventListener('message', function(ev){
    var m=ev.data||{}; if(!m.__pgbldCmd) return;
    if(m.t==='getHTML'){ post({t:'html', reqId:m.reqId, html:cleanHTML()}); }
    else if(m.t==='setImage'){ var el=document.querySelector('[data-eid="'+m.id+'"]'); if(el){ el.src=m.src; el.removeAttribute('srcset'); el.classList.remove('ph'); markDirty(); } }
    else if(m.t==='insertBlock'){ insertBlock(m.html, m.anchorId, m.position); }
    else if(m.t==='reindex'){ buildSections(); }
  });

  function insertBlock(html, anchorId, position){
    var host=document.querySelector('.pgbld .wrap')||document.querySelector('.pgbld'); if(!host) return;
    var tmp=document.createElement('div'); tmp.innerHTML=html; var node=tmp.firstElementChild; if(!node) return;
    var anchor=anchorId?document.querySelector('[data-eid="'+anchorId+'"]'):null;
    if(anchor && anchor.parentNode){ if(position==='before') anchor.parentNode.insertBefore(node,anchor); else anchor.parentNode.insertBefore(node, anchor.nextSibling); }
    else host.appendChild(node);
    buildSections(); markDirty();
    node.scrollIntoView({behavior:'smooth', block:'center'});
  }

  // ── produce a clean copy of the page for saving (strip ALL editor chrome) ──
  function cleanHTML(){
    var pg=document.querySelector('.pgbld'); if(!pg) return '';
    var clone=pg.cloneNode(true);
    clone.querySelectorAll('.ed-rail,.ed-toolbar,.ed-add').forEach(function(x){ x.remove(); });
    clone.querySelectorAll('[contenteditable]').forEach(function(x){ x.removeAttribute('contenteditable'); });
    clone.querySelectorAll('[data-ed-hover]').forEach(function(x){ x.removeAttribute('data-ed-hover'); });
    clone.querySelectorAll('[data-ed-img]').forEach(function(x){ x.removeAttribute('data-ed-img'); });
    clone.querySelectorAll('[data-eid]').forEach(function(x){ x.removeAttribute('data-eid'); });
    clone.querySelectorAll('details[data-ed-forceopen]').forEach(function(x){ x.removeAttribute('open'); x.removeAttribute('data-ed-forceopen'); });
    clone.querySelectorAll('[data-ed-sechover]').forEach(function(x){ x.removeAttribute('data-ed-sechover'); });
    clone.querySelectorAll('.ed-secwrap').forEach(function(x){ x.classList.remove('ed-secwrap'); });
    return clone.outerHTML;
  }

  // FAQ / accordion answers live inside <details> — force them open so the answer text is visible and
  // editable, and keep them open (clicking a question to edit it must not collapse the answer).
  function openAllDetails(){ document.querySelectorAll('details').forEach(function(d){ if(!d.open){ d.setAttribute('data-ed-forceopen',''); d.open=true; } }); }
  openAllDetails();
  document.addEventListener('toggle', function(e){ if(e.target&&e.target.tagName==='DETAILS'&&!e.target.open) e.target.open=true; }, true);

  buildSections();
  post({t:'ready'});
})();
</script>
