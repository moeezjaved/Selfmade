<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selfmade — Logo Exploration</title>
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{ --orange:#EF4A1E; --cream:#FFF7EC; --ink:#141d15; --paper:#F4EFE4;
    --sans:'General Sans',system-ui,sans-serif; --mono:'Space Mono',monospace }
  *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:1180px;margin:0 auto;padding:64px 28px 120px}
  h1{font-size:clamp(30px,4.5vw,52px);letter-spacing:-.03em;margin:0}
  h1 em{font-style:normal;color:var(--orange)}
  .sub{color:#6b6a58;margin:10px 0 0;max-width:60ch}
  h2{font-size:13px;font-family:var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--orange);margin:74px 0 22px;border-top:1.5px solid #d9d2c0;padding-top:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
  .cell{background:#fff;border:1px solid #e4ddca;border-radius:10px;overflow:hidden}
  .tile{aspect-ratio:1/1;display:grid;place-items:center;background:var(--orange);color:var(--cream)}
  .tile svg{width:62%;height:62%}
  .meta{padding:12px 14px}
  .meta b{display:block;font-size:13.5px}
  .meta span{display:block;font-size:11.5px;color:#77755f;margin-top:3px;line-height:1.45}
  .meta i{font-family:var(--mono);font-style:normal;font-size:10px;color:#a39f86}

  /* finals */
  .final{background:#fff;border:1px solid #e4ddca;border-radius:12px;padding:22px;margin-bottom:22px;display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start}
  @media(max-width:760px){.final{grid-template-columns:1fr}}
  .final .hero{aspect-ratio:1/1;border-radius:14px;background:var(--orange);color:var(--cream);display:grid;place-items:center}
  .final .hero svg{width:60%;height:60%}
  .fh b{font-size:19px;letter-spacing:-.01em}
  .fh p{margin:6px 0 0;font-size:13.5px;color:#66644f;line-height:1.55;max-width:58ch}
  .ways{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
  .way{width:74px;height:74px;border-radius:10px;display:grid;place-items:center;border:1px solid #e4ddca}
  .way svg{width:58%;height:58%}
  .w1{background:var(--orange);color:var(--cream)} .w2{background:var(--cream);color:var(--orange)}
  .w3{background:var(--cream);color:var(--ink)} .w4{background:var(--ink);color:var(--cream)}
  .tiny{display:flex;align-items:center;gap:12px;margin-top:14px}
  .tiny .t{border-radius:4px;background:var(--orange);color:var(--cream);display:grid;place-items:center}
  .t16{width:16px;height:16px}.t16 svg{width:12px;height:12px}
  .t24{width:24px;height:24px}.t24 svg{width:17px;height:17px}
  .t40{width:40px;height:40px}.t40 svg{width:27px;height:27px}
  .tiny span{font:400 10.5px var(--mono);color:#a39f86}
  .lock{margin-top:18px;background:var(--cream);border:1px solid #e8dfc9;border-radius:10px;padding:20px 24px;display:flex;align-items:center;gap:16px}
  .lock svg{width:40px;height:40px;color:var(--orange);flex:none}
  .lock img{height:26px;width:auto;display:block}
</style></head><body>
<div class="wrap">
  <h1>Selfmade <em>mark</em> exploration</h1>
  <p class="sub">16 distinct directions for "The Company That Runs Itself" — single geometric symbols built around autonomy, loops, and systems in motion. All drawn as flat vector, no letterforms traced, no existing marks imitated.</p>

  <!-- ================= SYMBOL DEFS (all currentColor) ================= -->
  <svg width="0" height="0" style="position:absolute">
    <!-- 01 ORBIT: the loop places its own next step -->
    <symbol id="m1" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="30" fill="none" stroke="currentColor" stroke-width="13" pathLength="100" stroke-dasharray="78 22" stroke-dashoffset="89" stroke-linecap="round" transform="rotate(-45 60 60)"/>
      <circle cx="81.2" cy="38.8" r="7" fill="currentColor"/>
    </symbol>
    <!-- 02 MOMENTUM: dashes grow into a solid — it gets better every cycle -->
    <symbol id="m2" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="30" fill="none" stroke="currentColor" stroke-width="13" pathLength="100" stroke-linecap="round" transform="rotate(-90 60 60)"
        stroke-dasharray="2 3.5 4 3.5 6 3.5 8 3.5 10 3.5 12 3.5 14 3.5 16 3.5"/>
    </symbol>
    <!-- 03 TWIN HOOKS: two forms carrying each other; S in the negative space -->
    <symbol id="m3" viewBox="0 0 120 120">
      <path d="M34 40 H64 A18 18 0 0 1 82 58 V64" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
      <path d="M34 40 H64 A18 18 0 0 1 82 58 V64" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" transform="rotate(180 60 60)"/>
    </symbol>
    <!-- 04 DRIFT: a whole splitting and sliding — motion with no one pushing -->
    <symbol id="m4" viewBox="0 0 120 120">
      <path d="M26 60 A34 34 0 0 1 94 60 Z" fill="currentColor" transform="translate(-7 -3.5)"/>
      <path d="M26 60 A34 34 0 0 0 94 60 Z" fill="currentColor" transform="translate(7 3.5)"/>
    </symbol>
    <!-- 05 INWARD: continuous path spiralling to a decision -->
    <symbol id="m5" viewBox="0 0 120 120">
      <path d="M88 34 H42 Q30 34 30 46 V76 Q30 88 42 88 H72 Q84 88 84 76 V58 Q84 46 72 46 H58" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
      <circle cx="55" cy="66" r="6.5" fill="currentColor"/>
    </symbol>
    <!-- 06 LENS: two systems overlapping; shared focus knocked out -->
    <symbol id="m6" viewBox="0 0 120 120">
      <path fill-rule="evenodd" fill="currentColor" d="M44 38 a22 22 0 1 0 .01 0 Z M76 38 a22 22 0 1 0 .01 0 Z"/>
    </symbol>
    <!-- 07 FLYWHEEL: three parts chasing — perpetual operation -->
    <symbol id="m7" viewBox="0 0 120 120">
      <path d="M84.5 39.4 A32 32 0 0 1 84.5 80.6" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
      <path d="M84.5 39.4 A32 32 0 0 1 84.5 80.6" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" transform="rotate(120 60 60)"/>
      <path d="M84.5 39.4 A32 32 0 0 1 84.5 80.6" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" transform="rotate(240 60 60)"/>
    </symbol>
    <!-- 08 OVERTAKE: the track, and the runner going wide on its own -->
    <symbol id="m8" viewBox="0 0 120 120">
      <rect x="28" y="28" width="64" height="64" rx="20" fill="none" stroke="currentColor" stroke-width="12" pathLength="100" stroke-dasharray="88 12" stroke-dashoffset="76" stroke-linecap="round"/>
      <path d="M104 36.4 A34 34 0 0 0 83.6 16" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
    </symbol>
    <!-- 09 SWITCHBACK: one continuous road driving itself -->
    <symbol id="m9" viewBox="0 0 120 120">
      <path d="M30 32 H74 A12 12 0 0 1 74 56 H46 A12 12 0 0 0 46 80 H90" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
    </symbol>
    <!-- 10 TURBINE: two blades in rotation; S-current between them -->
    <symbol id="m10" viewBox="0 0 120 120">
      <path d="M60 24 A36 36 0 0 1 96 60 L60 60 Z" fill="currentColor"/>
      <path d="M60 24 A36 36 0 0 1 96 60 L60 60 Z" fill="currentColor" transform="rotate(180 60 60)"/>
    </symbol>
    <!-- 11 SLING: momentum releases its own payload -->
    <symbol id="m11" viewBox="0 0 120 120">
      <circle cx="54" cy="66" r="26" fill="none" stroke="currentColor" stroke-width="12"/>
      <circle cx="90" cy="30" r="9.5" fill="currentColor"/>
    </symbol>
    <!-- 12 RELAY: the loop dissolving into hand-offs -->
    <symbol id="m12" viewBox="0 0 120 120">
      <path d="M34 75 A30 30 0 1 1 86 75" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round"/>
      <circle cx="70.3" cy="88.2" r="6.5" fill="currentColor"/>
      <circle cx="49.7" cy="88.2" r="6.5" fill="currentColor"/>
    </symbol>
    <!-- 13 OPERATOR: the system, and the agent inside it -->
    <symbol id="m13" viewBox="0 0 120 120">
      <rect x="32" y="32" width="56" height="56" rx="17" fill="none" stroke="currentColor" stroke-width="12"/>
      <circle cx="72" cy="48" r="8" fill="currentColor"/>
    </symbol>
    <!-- 14 THREAD: a bar weaving itself through the frame -->
    <symbol id="m14" viewBox="0 0 120 120">
      <path d="M14 60 H106" stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none"/>
      <rect x="81" y="50" width="18" height="20" fill="var(--bgc,#EF4A1E)"/>
      <rect x="30" y="30" width="60" height="60" rx="18" fill="none" stroke="currentColor" stroke-width="12"/>
      <rect x="21" y="50" width="18" height="20" fill="var(--bgc,#EF4A1E)"/>
      <path d="M14 60 H44" stroke="currentColor" stroke-width="12" stroke-linecap="round" fill="none"/>
    </symbol>
    <!-- 15 THROUGH: the way forward, cut out of the whole -->
    <symbol id="m15" viewBox="0 0 120 120">
      <circle cx="60" cy="60" r="34" fill="currentColor"/>
      <path d="M52 46 L70 60 L52 74" fill="none" stroke="var(--bgc,#EF4A1E)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- 16 CURRENTS: two waves working the same water -->
    <symbol id="m16" viewBox="0 0 120 120">
      <path d="M26 46 C38 32 52 32 60 44 C68 56 82 56 94 42" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
      <path d="M26 46 C38 32 52 32 60 44 C68 56 82 56 94 42" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round" transform="rotate(180 60 60)"/>
    </symbol>
  </svg>

  <h2>Round 1 — 16 directions</h2>
  <div class="grid" id="grid"></div>

  <h2>The final five</h2>
  <div id="finals"></div>
</div>

<script>
const C = [
 ["m1","01 · Orbit","The loop is open — and the system has already placed its own next step. Autonomy in one gesture.","loop · self-direction"],
 ["m2","02 · Momentum","A dot becomes a dash becomes a solid line. Every cycle it gets better — the promise, drawn literally.","compounding · cycles"],
 ["m3","03 · Twin Hooks","Two identical forms carrying each other in rotation. The channel between them is a quiet S.","two forms · hidden S"],
 ["m4","04 · Drift","One whole, split and sliding under its own power. Nothing pushes it. Hidden S along the seam.","motion · autonomy"],
 ["m5","05 · Inward","One continuous path that narrows to a decision. Research → conclusion, as geometry.","continuous path"],
 ["m6","06 · Lens","Two systems overlap; the shared focus is knocked out of the middle. Brand + machine.","negative space"],
 ["m7","07 · Flywheel","Three equal parts chasing each other forever. A machine that never needs a hand.","perpetual · system"],
 ["m8","08 · Overtake","A closed track — and the runner swinging wide of it on its own line.","speed · initiative"],
 ["m9","09 · Switchback","One road, driving itself through every turn. Reads faintly as an abstract S.","journey · continuity"],
 ["m10","10 · Turbine","Two blades in rotation; the current between them curves like an S. Bold at any size.","rotation · energy"],
 ["m11","11 · Sling","The loop's momentum has released its own payload. Launch, without a launcher.","launch · momentum"],
 ["m12","12 · Relay","The loop dissolves into hand-offs — work passed around the cycle by itself.","hand-off · agents"],
 ["m13","13 · Operator","The system frame, and the single agent alive inside it.","system · presence"],
 ["m14","14 · Thread","A line weaving itself through the frame — over one side, under the other.","weave · self-driven"],
 ["m15","15 · Through","The way forward exists as negative space cut from the whole.","hidden arrow"],
 ["m16","16 · Currents","Two waves working the same water in opposite phase. Echoes the wordmark's swash.","waves · duality"],
];
document.getElementById('grid').innerHTML = C.map(([id,name,desc,tag])=>`
  <div class="cell"><div class="tile"><svg><use href="#${id}"/></svg></div>
  <div class="meta"><b>${name}</b><span>${desc}</span><i>${tag}</i></div></div>`).join('');

const FINALS = [
 ["m2","Momentum","Scores highest on the one thing no competitor can claim: it literally draws “gets better every day.” A dot grows into a dash grows into an unbroken line, around a loop that never ends. Unique silhouette (no known mark uses graduated dashing as identity), perfectly legible at 16px, and it doubles as a native loading indicator across the product."],
 ["m4","Drift","The boldest of the five. One disc, split and sliding under its own power — motion with nobody pushing, which IS the brand promise. The seam hides an S without drawing a letter. Massive presence as an app icon; survives any size because it's two solid shapes."],
 ["m10","Turbine","Pure rotational energy from two identical blades — the company as a machine spinning on its own. The S-shaped current between the blades ties it to the name. Extremely simple geometry = extremely durable brand asset."],
 ["m1","Orbit","The quietest and most intelligent: the loop is open, and the system has already placed its own next step in the gap. Reads as autopilot, planning, autonomy. The dot gives it a face that's recognizable without the wordmark."],
 ["m3","Twin Hooks","Two identical forms carrying each other in perfect rotation — the founder and the machine, or the brand and Mello. The negative channel between them is a soft S. Feels premium and editorial; strongest lockup partner for the wavy wordmark."],
];
document.getElementById('finals').innerHTML = FINALS.map(([id,name,why])=>`
  <div class="final">
    <div class="hero"><svg><use href="#${id}"/></svg></div>
    <div class="fh">
      <b>${name}</b>
      <p>${why}</p>
      <div class="ways">
        <div class="way w1" style="--bgc:#EF4A1E"><svg><use href="#${id}"/></svg></div>
        <div class="way w2" style="--bgc:#FFF7EC"><svg><use href="#${id}"/></svg></div>
        <div class="way w3" style="--bgc:#FFF7EC"><svg><use href="#${id}"/></svg></div>
        <div class="way w4" style="--bgc:#141d15"><svg><use href="#${id}"/></svg></div>
      </div>
      <div class="tiny">
        <div class="t t40" style="--bgc:#EF4A1E"><svg><use href="#${id}"/></svg></div>
        <div class="t t24" style="--bgc:#EF4A1E"><svg><use href="#${id}"/></svg></div>
        <div class="t t16" style="--bgc:#EF4A1E"><svg><use href="#${id}"/></svg></div>
        <span>40 / 24 / 16 px</span>
      </div>
      <div class="lock" style="--bgc:#FFF7EC">
        <svg><use href="#${id}"/></svg>
        <img src="/selfmade-wordmark.png" alt="Selfmade">
      </div>
    </div>
  </div>`).join('');
</script>
</body></html>
