<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#a21caf"/>
      <stop offset="1" stop-color="#db2777"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <!-- big brand pop -->
  <circle cx="965" cy="200" r="230" fill="#dffe95" opacity="0.16"/>
  <circle cx="965" cy="200" r="150" fill="#dffe95" opacity="0.14"/>

  <!-- ad-card grid, one 'winner' highlighted lime -->
  <g transform="translate(760,300)">
    <rect x="0"   y="0"   width="115" height="150" rx="14" fill="#ffffff" opacity="0.22"/>
    <rect x="135" y="0"   width="115" height="150" rx="14" fill="#ffffff" opacity="0.22"/>
    <rect x="270" y="0"   width="115" height="150" rx="14" fill="#dffe95"/>
    <rect x="286" y="118" width="60"  height="14"  rx="7"  fill="#0e1b12" opacity="0.65"/>
    <rect x="0"   y="170" width="115" height="150" rx="14" fill="#ffffff" opacity="0.22"/>
    <rect x="135" y="170" width="115" height="150" rx="14" fill="#ffffff" opacity="0.22"/>
    <rect x="270" y="170" width="115" height="150" rx="14" fill="#ffffff" opacity="0.22"/>
    <!-- magnifier over the winner -->
    <circle cx="327" cy="75" r="66" fill="none" stroke="#0e1b12" stroke-width="12"/>
    <line x1="374" y1="122" x2="418" y2="166" stroke="#0e1b12" stroke-width="16" stroke-linecap="round"/>
  </g>

  <!-- label + headline -->
  <text x="80" y="150" fill="#dffe95" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="800" letter-spacing="4">SELFMADE · PLAYBOOK</text>
  <text x="76" y="300" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3">How to find</text>
  <text x="76" y="392" fill="#ffffff" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3">winning</text>
  <text x="76" y="484" fill="#dffe95" font-family="Inter, Arial, sans-serif" font-size="88" font-weight="800" letter-spacing="-3" font-style="italic">Meta ads</text>
  <text x="80" y="600" fill="#ffffff" opacity="0.85" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Steal what already works — without guessing.</text>
</svg>
