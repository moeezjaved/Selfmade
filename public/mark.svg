<svg viewBox="0 0 900 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Selfmade">
  <!-- The mark sits inset (100px transparent margin all round) so it renders ~25% smaller in the
       browser tab / loaders — full-bleed read as oversized next to other favicons. -->
  <g transform="translate(100,100)">
    <rect width="700" height="700" fill="#ef4a1e"/>
    <g fill="#ffffff" shape-rendering="crispEdges">
      <rect x="300" y="0"   width="100" height="100"/>
      <rect x="100" y="100" width="100" height="100"/>
      <rect x="500" y="100" width="100" height="100"/>
      <rect x="200" y="200" width="100" height="100"/>
      <rect x="400" y="200" width="100" height="100"/>
      <rect x="0"   y="300" width="100" height="100"/>
      <rect x="600" y="300" width="100" height="100"/>
      <rect x="200" y="400" width="100" height="100"/>
      <rect x="400" y="400" width="100" height="100"/>
      <rect x="100" y="500" width="100" height="100"/>
      <rect x="500" y="500" width="100" height="100"/>
      <rect x="300" y="600" width="100" height="100"/>
    </g>
  </g>
</svg>
