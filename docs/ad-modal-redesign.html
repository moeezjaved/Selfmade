<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self Made — Ad-creation modal redesign (reference mockup)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.7.0/dist/tabler-icons.min.css">
<style>
  body{margin:0;min-height:100vh;background:#0a0f0b;display:flex;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  *{box-sizing:border-box;}
</style>
</head>
<body>
  <!-- REFERENCE MOCKUP for redesigning CloneModal.tsx. Not production code — a visual target.
       Readability rules baked in: labels >=13px, field labels 12px, helper text 12.5px,
       secondary text no dimmer than ~#a9bdae on the dark bg, credit cost promoted to the footer. -->
  <div style="width:min(440px,96%);background:#141b16;border:1px solid #2a3a22;border-radius:16px;color:#eaf2ea;overflow:hidden;">

    <div style="display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid #24301d;">
      <div style="width:44px;height:44px;border-radius:10px;background:#20301c;display:flex;align-items:center;justify-content:center;color:#7fae6a;flex-shrink:0;"><i class="ti ti-photo" style="font-size:20px"></i></div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:16px;font-weight:600;">Remake this ad</div>
        <div style="font-size:12.5px;color:#9db0a2;">from Estalife · milk thistle</div>
      </div>
      <button aria-label="Close" style="background:transparent;border:none;color:#9db0a2;cursor:pointer;padding:4px;"><i class="ti ti-x" style="font-size:20px"></i></button>
    </div>

    <div style="padding:18px;display:flex;flex-direction:column;gap:18px;">

      <div>
        <div style="font-size:13px;font-weight:600;color:#c7d8c9;margin-bottom:9px;">Your product</div>
        <div style="display:flex;gap:10px;">
          <div style="width:60px;height:60px;border-radius:10px;background:#1c2a18;display:flex;align-items:center;justify-content:center;color:#7fae6a;"><i class="ti ti-photo" style="font-size:18px"></i></div>
          <div style="width:60px;height:60px;border-radius:10px;background:#1c2a18;display:flex;align-items:center;justify-content:center;color:#7fae6a;"><i class="ti ti-photo" style="font-size:18px"></i></div>
          <button style="width:60px;height:60px;border-radius:10px;border:1.5px dashed #37502f;background:transparent;color:#a9bdae;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-family:inherit;"><i class="ti ti-plus" style="font-size:16px"></i>Add</button>
          <button style="width:60px;height:60px;border-radius:10px;border:1.5px dashed #37502f;background:transparent;color:#a9bdae;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-family:inherit;"><i class="ti ti-folder" style="font-size:16px"></i>Assets</button>
        </div>
      </div>

      <div>
        <div style="font-size:13px;font-weight:600;color:#c7d8c9;margin-bottom:9px;">Headline <span style="color:#8ba290;font-weight:400;">(optional)</span></div>
        <input placeholder="2,000mg high potency milk thistle" style="width:100%;background:#0c120e;border:1px solid #26331d;border-radius:9px;padding:10px 12px;color:#eaf2ea;font-size:14px;font-family:inherit;outline:none;margin-bottom:9px;" />
        <div style="display:flex;gap:9px;align-items:flex-start;background:rgba(22,34,22,0.5);border:1px solid #294029;border-radius:10px;padding:10px 12px;">
          <i class="ti ti-bulb" style="font-size:17px;color:#dffe95;flex-shrink:0;margin-top:1px;"></i>
          <span style="font-size:12.5px;line-height:1.5;color:#bcd0be;">Type your headline so the text on the ad is accurate — otherwise the AI writes its own, and can misspell.</span>
        </div>
      </div>

      <div>
        <div style="font-size:13px;font-weight:600;color:#c7d8c9;margin-bottom:9px;">Format</div>
        <div style="display:flex;flex-direction:column;gap:11px;">
          <div>
            <div style="font-size:12px;color:#a9bdae;margin-bottom:5px;">Aspect ratio</div>
            <div style="display:flex;gap:7px;">
              <span style="flex:1;text-align:center;background:#dffe95;color:#14281a;border:1px solid #dffe95;border-radius:9px;padding:8px 0;font-size:13px;font-weight:600;">4:5</span>
              <span style="flex:1;text-align:center;background:#0c120e;color:#a9bdae;border:1px solid #26331d;border-radius:9px;padding:8px 0;font-size:13px;">1:1</span>
              <span style="flex:1;text-align:center;background:#0c120e;color:#a9bdae;border:1px solid #26331d;border-radius:9px;padding:8px 0;font-size:13px;">9:16</span>
            </div>
          </div>
          <div style="display:flex;gap:14px;">
            <div style="flex:1;">
              <div style="font-size:12px;color:#a9bdae;margin-bottom:5px;">Quality</div>
              <div style="display:flex;gap:7px;">
                <span style="flex:1;text-align:center;background:#dffe95;color:#14281a;border:1px solid #dffe95;border-radius:9px;padding:8px 0;font-size:13px;font-weight:600;">2K</span>
                <span style="flex:1;text-align:center;background:#0c120e;color:#a9bdae;border:1px solid #26331d;border-radius:9px;padding:8px 0;font-size:13px;">4K</span>
              </div>
            </div>
            <div style="flex:1.4;">
              <div style="font-size:12px;color:#a9bdae;margin-bottom:5px;">Variations</div>
              <div style="display:flex;gap:7px;">
                <span style="flex:1;text-align:center;background:#0c120e;color:#a9bdae;border:1px solid #26331d;border-radius:9px;padding:8px 0;font-size:13px;">1</span>
                <span style="flex:1;text-align:center;background:#dffe95;color:#14281a;border:1px solid #dffe95;border-radius:9px;padding:8px 0;font-size:13px;font-weight:600;">2</span>
                <span style="flex:1;text-align:center;background:#0c120e;color:#a9bdae;border:1px solid #26331d;border-radius:9px;padding:8px 0;font-size:13px;">3</span>
                <span style="flex:1;text-align:center;background:#0c120e;color:#a9bdae;border:1px solid #26331d;border-radius:9px;padding:8px 0;font-size:13px;">4</span>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>

    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid #24301d;background:#111812;">
      <div style="display:flex;flex-direction:column;">
        <span style="font-size:13.5px;font-weight:600;color:#dbe8dd;">Uses 30 credits</span>
        <span style="font-size:11.5px;color:#8ba290;">2 variations · ≈ $0.30</span>
      </div>
      <button style="display:flex;align-items:center;gap:8px;background:#dffe95;color:#14281a;border:none;border-radius:11px;padding:11px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;"><i class="ti ti-sparkles" style="font-size:17px"></i>Generate ad</button>
    </div>

  </div>
</body>
</html>
